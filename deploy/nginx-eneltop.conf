# Preparación HTTP para eneltop.com en ai1.
# Instalar tras copiar el sitio a /var/www/eneltop.com.
# Certbot añadirá el bloque HTTPS después del cambio DNS.
server {
    server_name eneltop.com www.eneltop.com;

    root /var/www/eneltop.com;
    index index.html;

    location ~ /\.(?!well-known) {
        return 404;
    }

    location = /api/visits {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/eneltop.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/eneltop.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.eneltop.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = eneltop.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name eneltop.com www.eneltop.com;
    return 404; # managed by Certbot




}
