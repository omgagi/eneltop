# Preparación HTTP para eneltop.com en ai1.
# Instalar tras copiar el sitio a /var/www/eneltop.com.
# Certbot añadirá el bloque HTTPS después del cambio DNS.
server {
    listen 80;
    listen [::]:80;
    server_name eneltop.com www.eneltop.com;

    root /var/www/eneltop.com;
    index index.html;

    location ~ /\.(?!well-known) {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
