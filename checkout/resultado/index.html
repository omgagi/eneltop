<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Estado del pago — eneltop.com</title>
  <link rel="stylesheet" href="../../styles.css?v=33">
  <style>
    .payment-result{max-width:750px;margin:6vh auto;padding:32px;border:1px solid var(--line);border-radius:24px;background:#fff;text-align:center;color:#1d2a3d}
    .payment-result h1{margin:12px 0 8px;font-size:clamp(30px,6vw,46px)}
    .payment-result p{color:#607186;line-height:1.55}
    .payment-result .brand{justify-content:center}
    .share-panel{margin-top:28px;text-align:left;border-top:1px solid var(--line);padding-top:25px}
    .share-panel[hidden],.payment-result a[hidden]{display:none}
    .share-panel h2{font-size:25px;margin:0 0 8px}
    .share-panel img{display:block;width:100%;height:auto;border:1px solid #dbe4ed;border-radius:18px;margin:19px 0}
    .share-actions{display:flex;flex-wrap:wrap;gap:10px}
    .share-actions button,.share-actions a,.ranking-link{border:1px solid #cbd8e4;background:#fff;color:#17576c;border-radius:999px;padding:12px 18px;font:700 15px system-ui,sans-serif;text-decoration:none;cursor:pointer}
    .share-actions .primary,.ranking-link{background:#17576c;color:#fff;border-color:#17576c}
    .share-feedback{min-height:1.4em;font-size:14px}
    .ranking-link{display:inline-block;margin-top:22px}
    #invoice-link{display:block;width:max-content;max-width:100%;margin:18px auto 0;color:#17576c}
    @media(max-width:600px){.payment-result{margin:2vh 12px;padding:22px 18px}.share-actions button,.share-actions a{flex:1;text-align:center;white-space:nowrap}}
  </style>
</head>
<body>
  <main class="payment-result">
    <a class="brand" href="/" aria-label="eneltop.com, inicio"><span class="brand-symbol"><i></i><i></i><i></i></span><span>eneltop<span class="brand-period">.com</span></span></a>
    <h1 id="result-title">Comprobando el pago…</h1>
    <p id="result-message">Tu proyecto se publicará cuando recibamos la confirmación de Dodo Payments.</p>
    <section id="share-panel" class="share-panel" aria-labelledby="share-title" hidden>
      <h2 id="share-title">¡Comparte tu puesto!</h2>
      <p id="share-description">Tu tarjeta está lista.</p>
      <img id="share-preview" alt="Tarjeta de tu puesto en eneltop.com" width="1200" height="630">
      <div class="share-actions">
        <button id="share-native" class="primary" type="button">Compartir mi puesto →</button>
        <button id="copy-link" type="button">Copiar enlace</button>
        <a id="download-image" href="#" download="mi-puesto-eneltop.png">Descargar imagen</a>
        <a id="share-whatsapp" href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a>
        <a id="share-x" href="#" target="_blank" rel="noopener noreferrer">X</a>
      </div>
      <p id="share-feedback" class="share-feedback" role="status" aria-live="polite"></p>
    </section>
    <a id="ranking-link" class="ranking-link" href="/">Ver mi puesto en el ranking</a>
    <a id="invoice-link" href="#" target="_blank" rel="noopener noreferrer" hidden>Ver factura de Dodo Payments</a>
  </main>
  <script>
    const id=new URLSearchParams(location.search).get('pedido');
    const $=name=>document.getElementById(name);
    let currentShare=null,cardFile=null,cardKey='';
    function updateShare(share){
      currentShare=share;
      const first=share.rank===1;
      const text=first
        ? `¡Llegué al #1 de ${share.category} en eneltop.com! ¿Quién se anima a superarme?`
        : `¡Entré al puesto #${share.rank} de ${share.category} en eneltop.com! Mira mi proyecto.`;
      const url=share.url+`?puesto=${share.rank}&v=${Math.floor(Date.now()/60000)}`;
      const card=`/api/share/card?id=${encodeURIComponent(share.id)}&puesto=${share.rank}`;
      $('share-title').textContent=first?'¡Llegaste al #1!':`¡Ya estás en el #${share.rank}!`;
      $('share-description').textContent='Comparte esta tarjeta y reta a tus contactos a entrar al ranking.';
      $('share-preview').src=card;
      $('download-image').href=card;
      const nextKey=share.id+':'+share.rank;
      if(cardKey!==nextKey){
        cardKey=nextKey;cardFile=null;
        fetch(card,{cache:'no-store'}).then(response=>response.ok?response.blob():null)
          .then(blob=>{if(blob&&cardKey===nextKey)cardFile=new File([blob],'mi-puesto-eneltop.png',{type:'image/png'})})
          .catch(()=>{});
      }
      $('share-whatsapp').href='https://wa.me/?text='+encodeURIComponent(text+' '+url);
      $('share-x').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(url);
      $('share-panel').hidden=false;
      return {text,url};
    }
    function shareData(){
      if(!currentShare)return null;
      const first=currentShare.rank===1;
      return {title:first?'¡Llegué al #1 en eneltop.com!':`¡Entré al #${currentShare.rank} en eneltop.com!`,
        text:first
          ? `¡Llegué al #1 de ${currentShare.category} en eneltop.com! ¿Quién se anima a superarme?`
          : `¡Entré al puesto #${currentShare.rank} de ${currentShare.category} en eneltop.com! Mira mi proyecto.`,
        url:currentShare.url+`?puesto=${currentShare.rank}&v=${Math.floor(Date.now()/60000)}`};
    }
    async function copyLink(){
      const data=shareData();if(!data)return;
      try{await navigator.clipboard.writeText(data.text+' '+data.url);$('share-feedback').textContent='Enlace y mensaje copiados.'}
      catch{$('share-feedback').textContent='No se pudo copiar. Usa el enlace para compartir.'}
    }
    $('share-native').addEventListener('click',async()=>{
      const data=shareData();if(!data)return;
      if(!navigator.share)return copyLink();
      const payload=cardFile&&navigator.canShare?.({files:[cardFile]})?{...data,files:[cardFile]}:data;
      try{await navigator.share(payload)}catch(error){if(error.name!=='AbortError')$('share-feedback').textContent='No se pudo abrir el menú. Usa Copiar enlace.'}
    });
    $('copy-link').addEventListener('click',copyLink);
    async function check(){
      if(!id){$('result-title').textContent='Pedido no encontrado';return}
      try{
        const response=await fetch('/api/checkout/status?id='+encodeURIComponent(id),{cache:'no-store'});
        if(!response.ok)throw new Error();
        const order=await response.json();
        if(order.status==='paid'){
          $('result-title').textContent='¡Pago confirmado!';
          $('result-message').textContent=order.share
            ?`Tu proyecto ocupa el #${order.share.rank} de ${order.share.category}.`
            :'Tu proyecto ya aparece en '+order.category+'.';
          $('ranking-link').href='/?proyecto='+encodeURIComponent(id)+'#ranking';
          if(order.share)updateShare(order.share);else $('share-panel').hidden=true;
          if(order.invoiceUrl){$('invoice-link').href=order.invoiceUrl;$('invoice-link').hidden=false}
          setTimeout(check,30000);return;
        }
        $('share-panel').hidden=true;currentShare=null;
        if(order.status==='refunded'){$('result-title').textContent='Pago reembolsado';$('result-message').textContent='El proyecto ya no ocupa un puesto de pago.';return}
        if(order.status==='failed'){$('result-title').textContent='Pago no iniciado';$('result-message').textContent='Vuelve al ranking para intentarlo de nuevo.';return}
        setTimeout(check,3000);
      }catch{$('result-title').textContent='No se pudo consultar el estado';$('result-message').textContent='Vuelve a intentarlo en unos minutos.';setTimeout(check,30000)}
    }
    check();
  </script>
</body>
</html>
